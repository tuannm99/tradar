[package]
name = "tradar-query-workbench"
version = "0.1.0"
edition = "2024"

[dependencies]
tradar-core = { path = "../tradar-core" }
tradar-connector-spi = { path = "../tradar-connector-spi" }

tokio = { version = "1", features = ["sync", "rt", "macros", "rt-multi-thread", "time"] }
ratatui = "0.30"
crossterm = "0.29"
async-trait = "0.1"
anyhow = "1"
serde_json = "1"
tree-sitter-sequel = "0.3.11"
tree-sitter-highlight = "0.26.12"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
