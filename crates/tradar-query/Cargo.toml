[package]
name = "tradar-query"
version = "0.1.0"
edition = "2024"

# The `QueryDriver` contract and its shared helpers. Deliberately no UI and
# no other workspace crate (see src/lib.rs).
[dependencies]
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["time", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util", "time"] }
