[package]
name = "tradar-connector-mongo"
version = "0.1.0"
edition = "2024"

[dependencies]
tradar-core = { path = "../tradar-core" }
tradar-connector-spi = { path = "../tradar-connector-spi" }
tradar-query-workbench = { path = "../tradar-query-workbench" }

async-trait = "0.1"
anyhow = "1"
mongodb = { version = "3", features = ["bson-3"] }
bson = { version = "3.1", features = ["serde_json-1"] }
futures-util = "0.3"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
testcontainers-modules = { version = "0.11", features = ["mongo"] }
