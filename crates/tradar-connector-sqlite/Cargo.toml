[package]
name = "tradar-connector-sqlite"
version = "0.1.0"
edition = "2024"

[dependencies]
tradar-query = { path = "../tradar-query" }
# The TUI's `Connector`/`Session` (feature `tui`); `tradar-server` uses
# `opener()` and builds without them.
tradar-core = { path = "../tradar-core", optional = true }
tradar-connector-spi = { path = "../tradar-connector-spi", optional = true }
tradar-query-workbench = { path = "../tradar-query-workbench", optional = true }

async-trait = "0.1"
anyhow = "1"
futures-util = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
# Same instance `sqlx-sqlite` itself depends on (Cargo unifies by semver
# range, confirmed against Cargo.lock) -- needed to call `sqlite3_interrupt`
# directly for `cancel_query`, which sqlx's own safe API can't reach while
# the connection is busy; see the doc comment on `RawHandle` in `lib.rs`.
libsqlite3-sys = "0.30"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"

[features]
default = ["tui"]
tui = ["dep:tradar-core", "dep:tradar-connector-spi", "dep:tradar-query-workbench"]
