[package]
name = "tradar-connector-cassandra"
version = "0.1.0"
edition = "2024"

[dependencies]
tradar-query = { path = "../tradar-query" }
# The TUI's `Connector`/`Session` (feature `tui`); `tradar-server` uses
# `opener()` and builds without them.
tradar-core = { path = "../tradar-core", optional = true }
tradar-connector-spi = { path = "../tradar-connector-spi", optional = true }
tradar-query-workbench = { path = "../tradar-query-workbench", optional = true }

async-trait = "0.1"
anyhow = "1"
futures-util = "0.3"
scylla = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
testcontainers = "0.23"

[features]
default = ["tui"]
tui = ["dep:tradar-core", "dep:tradar-connector-spi", "dep:tradar-query-workbench"]
