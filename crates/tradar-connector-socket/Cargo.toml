[package]
name = "tradar-connector-socket"
version = "0.1.0"
edition = "2024"

[dependencies]
# TUI only (feature `tui`); `tradar-server` uses the shared module without it.
tradar-core = { path = "../tradar-core", optional = true }
tradar-connector-spi = { path = "../tradar-connector-spi", optional = true }

async-trait = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["net", "sync", "rt", "io-util"] }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[features]
default = ["tui"]
tui = ["dep:tradar-core", "dep:tradar-connector-spi", "dep:ratatui", "dep:crossterm"]
