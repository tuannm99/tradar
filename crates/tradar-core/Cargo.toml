[package]
name = "tradar-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
base64 = "0.22"
arboard = { version = "3", default-features = false, optional = true }
tradar-query = { path = "../tradar-query", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# Everything the (deprecated) TUI needs: theme, keymap, widgets, actions.
# `tradar-server` turns it off and keeps just `storage` and `capability`.
default = ["ui"]
ui = ["dep:ratatui", "dep:crossterm", "dep:arboard", "dep:tradar-query"]
