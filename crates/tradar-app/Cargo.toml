[package]
name = "tradar-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tradar"
path = "src/main.rs"

[dependencies]
tradar-core = { path = "../tradar-core" }

tokio = { version = "1", features = ["full"] }
ratatui = "0.30"
crossterm = "0.29"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres"] }
redis = { version = "1", features = ["tokio-comp"] }
mongodb = { version = "3", features = ["bson-3"] }
bson = { version = "3.1", features = ["serde_json-1"] }
futures-util = "0.3"
edtui = { version = "0.11.6", default-features = false }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
testcontainers-modules = { version = "0.11", features = ["postgres", "elastic_search", "redis", "mongo"] }
