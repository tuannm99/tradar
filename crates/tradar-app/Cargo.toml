[package]
name = "tradar-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tradar"
path = "src/main.rs"

[dependencies]
tradar-core = { path = "../tradar-core" }
tradar-connector-spi = { path = "../tradar-connector-spi" }
tradar-query-workbench = { path = "../tradar-query-workbench" }
tradar-connector-postgres = { path = "../tradar-connector-postgres" }
tradar-connector-sqlite = { path = "../tradar-connector-sqlite" }
tradar-connector-elasticsearch = { path = "../tradar-connector-elasticsearch" }
tradar-connector-redis = { path = "../tradar-connector-redis" }
tradar-connector-mongo = { path = "../tradar-connector-mongo" }
tradar-connector-cassandra = { path = "../tradar-connector-cassandra" }
tradar-connector-rabbitmq = { path = "../tradar-connector-rabbitmq" }
tradar-connector-kafka = { path = "../tradar-connector-kafka" }
tradar-connector-http = { path = "../tradar-connector-http" }

tokio = { version = "1", features = ["full"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
