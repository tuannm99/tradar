[package]
name = "tradar-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tradar"
path = "src/main.rs"

[dependencies]
tradar-core = { path = "../tradar-core" }
tradar-connector-api = { path = "../tradar-connector-api" }
tradar-query-workbench = { path = "../tradar-query-workbench" }
tradar-postgres = { path = "../connectors/tradar-postgres" }
tradar-sqlite = { path = "../connectors/tradar-sqlite" }
tradar-elasticsearch = { path = "../connectors/tradar-elasticsearch" }
tradar-redis = { path = "../connectors/tradar-redis" }
tradar-mongo = { path = "../connectors/tradar-mongo" }
tradar-cassandra = { path = "../connectors/tradar-cassandra" }
tradar-rabbitmq = { path = "../connectors/tradar-rabbitmq" }
tradar-kafka = { path = "../connectors/tradar-kafka" }

tokio = { version = "1", features = ["full"] }
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
