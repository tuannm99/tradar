[package]
name = "tradar-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "tradar_server"
path = "src/lib.rs"

[[bin]]
name = "tradar-server"
path = "src/main.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"
# No TUI: `tradar-core` without its `ui` feature (storage only), and each
# connector without `tui` -- the server opens drivers through `opener()`.
tradar-core = { path = "../tradar-core", default-features = false }
tradar-query = { path = "../tradar-query" }
tradar-connector-postgres = { path = "../tradar-connector-postgres", optional = true, default-features = false }
tradar-connector-mysql = { path = "../tradar-connector-mysql", optional = true, default-features = false }
tradar-connector-sqlite = { path = "../tradar-connector-sqlite", optional = true, default-features = false }
tradar-connector-elasticsearch = { path = "../tradar-connector-elasticsearch", optional = true, default-features = false }
tradar-connector-redis = { path = "../tradar-connector-redis", optional = true, default-features = false }
tradar-connector-mongo = { path = "../tradar-connector-mongo", optional = true, default-features = false }
tradar-connector-cassandra = { path = "../tradar-connector-cassandra", optional = true, default-features = false }
tradar-connector-clickhouse = { path = "../tradar-connector-clickhouse", optional = true, default-features = false }
# Non-query connectors: only their shared, TUI-free modules (target parsing,
# request helpers, previews); the server keeps its own request/push logic.
tradar-connector-rabbitmq = { path = "../tradar-connector-rabbitmq", optional = true, default-features = false }
tradar-connector-http = { path = "../tradar-connector-http", optional = true, default-features = false }
tradar-connector-socket = { path = "../tradar-connector-socket", optional = true, default-features = false }
tradar-connector-kafka = { path = "../tradar-connector-kafka", optional = true, default-features = false }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"

# gRPC -- not a `Connector`/`QueryDriver` (no query language, no TUI screen;
# see docs/architecture.md's "Chốt lại scope v1" under gRPC), so it bypasses
# `registry`/`State::drivers` entirely and lives in its own `grpc` module
# instead of a `tradar-connector-grpc` crate -- that trait contract exists
# to feed the TUI's registry, which gRPC deliberately does not target.
tonic = { version = "0.12", optional = true, features = ["tls", "tls-webpki-roots"] }
tonic-reflection = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
prost-reflect = { version = "0.14", optional = true, features = ["serde"] }
protox = { version = "0.7", optional = true }
tokio-stream = { version = "0.1", optional = true, features = ["net"] }
bytes = { version = "1", optional = true }

# Kafka tail -- the first connector this server pushes notifications for
# (see docs/backlog/push-channel-design-2026-10-14.md). Not a reuse of
# `tradar-connector-kafka` (its `KafkaSession` is built around a
# tick()-driven event queue for the TUI's render loop, a different shape
# than "push a notification line the moment a message arrives" -- same
# reasoning gRPC's own module above already set a precedent for: talk to
# the underlying client library directly rather than through a connector
# crate shaped for a different consumer). `futures-util` only for the
# consumer stream's `.next()`, same as that crate.
rdkafka = { version = "0.36", optional = true, features = ["cmake-build"] }
futures-util = { version = "0.3", optional = true }

# RabbitMQ -- no push-channel needed (the Management HTTP API has no
# streaming endpoint, see rabbitmq.rs's doc comment), so this is a plain
# request/response module like grpc.rs. Not a reuse of
# `tradar-connector-rabbitmq` (its types are `pub(crate)`-scoped to its own
# TUI `Screen`); needs no toolchain beyond `reqwest`, so it's a normal
# default feature rather than opt-in.
#
# HTTP (http.rs) shares this same `reqwest`/`serde` -- also no push-channel
# needed, same reasoning.
reqwest = { version = "0.12", optional = true, features = ["json"] }
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
tempfile = "3"
# Certificates for `tests/rpc_grpc.rs`'s TLS/mTLS cases.
rcgen = "0.13"
# Only `tests/rpc_kafka.rs` (feature `kafka`) uses this -- a real broker via
# `GenericImage`, same as `tradar-connector-kafka`'s own docker test.
testcontainers = "0.23"

[build-dependencies]
tonic-build = "0.12"
protox = "0.7"
prost = "0.13"

# Only the connectors that speak a query language -- the ones with a
# `QueryDriver` a headless client can drive. Kafka/RabbitMQ/HTTP/Socket
# have bespoke TUI screens and no driver to expose yet, see "Server
# headless" in docs/architecture.md. Feature names match `tradar-app`'s.
[features]
# `kafka` deliberately NOT in default: `rdkafka`'s `cmake-build` compiles
# `librdkafka` from vendored source and needs `cmake`/`gcc`/`libcurl-dev`
# on the build machine -- same reason `tradar-app`'s own `kafka` feature
# stays opt-in for `make test-unit` (see CLAUDE.md's "Commands").
default = ["postgres", "mysql", "sqlite", "mongo", "elasticsearch", "redis", "cassandra", "clickhouse", "grpc", "socket", "rabbitmq", "http"]
postgres = ["dep:tradar-connector-postgres"]
mysql = ["dep:tradar-connector-mysql"]
sqlite = ["dep:tradar-connector-sqlite"]
mongo = ["dep:tradar-connector-mongo"]
elasticsearch = ["dep:tradar-connector-elasticsearch"]
redis = ["dep:tradar-connector-redis"]
cassandra = ["dep:tradar-connector-cassandra"]
clickhouse = ["dep:tradar-connector-clickhouse"]
grpc = ["dep:tonic", "dep:tonic-reflection", "dep:prost", "dep:prost-reflect", "dep:protox", "dep:tokio-stream", "dep:bytes"]
kafka = ["dep:rdkafka", "dep:futures-util", "dep:tradar-connector-kafka"]
# Socket tail -- unlike `kafka`, needs no extra toolchain (plain
# `tokio::net::TcpStream`; the connector crate only adds its hex preview), so
# it's a normal default feature rather than opt-in.
socket = ["dep:tradar-connector-socket"]
rabbitmq = ["dep:reqwest", "dep:serde", "dep:tradar-connector-rabbitmq"]
http = ["dep:reqwest", "dep:serde", "dep:tradar-connector-http"]
