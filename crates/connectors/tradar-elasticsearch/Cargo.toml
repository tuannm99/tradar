[package]
name = "tradar-elasticsearch"
version = "0.1.0"
edition = "2024"

[dependencies]
tradar-core = { path = "../../tradar-core" }
tradar-connector-api = { path = "../../tradar-connector-api" }
tradar-query-workbench = { path = "../../tradar-query-workbench" }

async-trait = "0.1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
testcontainers-modules = { version = "0.11", features = ["elastic_search"] }
