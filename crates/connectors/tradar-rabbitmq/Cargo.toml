[package]
name = "tradar-rabbitmq"
version = "0.1.0"
edition = "2024"

[dependencies]
tradar-core = { path = "../../tradar-core" }
tradar-connector-api = { path = "../../tradar-connector-api" }

async-trait = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["sync", "rt"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
testcontainers = "0.23"
